name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm install`, not `npm ci`: this repo depends on plant-intel-mcp over
      # git, and a lockfile generated on macOS resolves a transitive picomatch
      # tree that Linux's stricter `npm ci` rejects. Reverting to `npm ci` is
      # the follow-up once plant-intel-mcp is published to npm and the git
      # dependency goes away.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Runs against demo mode: no keys, no network, deterministic.
      - run: npm run e2e
      - name: Audit what actually ships
        run: npm audit --omit=dev --audit-level=high

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: embed

  deploy:
    # The embed page is only published once the app it embeds is verified.
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
